[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ema"
version = "3.0.0a4"
description = "Analysis of electrically stimulated brain-slice recordings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "tifffile>=2022.2",
    "matplotlib>=3.6",
    "PyQt5>=5.15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "sphinx>=7", "furo"]

[project.gui-scripts]
ema = "ema.app:main"

[tool.setuptools]
packages = ["ema", "ema.roi_selection", "ema.evoked", "ema.evoked_analysis", "ema.evoked_configurator", "ema.spontaneous",
            "ema.spontaneous_configurator"]

[tool.setuptools.package-data]
ema = ["assets/*"]
"ema.evoked" = ["presets/*.json"]
"ema.spontaneous" = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
